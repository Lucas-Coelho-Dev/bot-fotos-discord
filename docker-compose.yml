services:
  bot-fotos:
    build: .
    image: bot-fotos:1.0.0
    container_name: bot-fotos
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NO_AUTOUPDATE: "true"
      TZ: America/Sao_Paulo
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - bot_fotos_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_fotos_data:
    name: bot_fotos_data
